apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-queue-long
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frappe-queue-long
  template:
    metadata:
      labels:
        app: frappe-queue-long
    spec:
      containers:
        - name: queue-long
          image: frappe/erpnext:v16.17.0
          command: ["bench", "worker", "--queue", "long,default,short"]
          env:
            - name: FRAPPE_REDIS_CACHE
              value: redis://redis-cache:6379
            - name: FRAPPE_REDIS_QUEUE
              value: redis://redis-queue:6379
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
            - name: logs
              mountPath: /home/frappe/frappe-bench/logs
      volumes:
        - name: sites
          persistentVolumeClaim:
            claimName: frappe-sites
        - name: logs
          persistentVolumeClaim:
            claimName: frappe-logs
---
