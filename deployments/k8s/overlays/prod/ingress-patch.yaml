apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frappe-ingress
spec:
  rules:
    - host: frappe.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frappe-frontend
                port:
                  number: 8080
